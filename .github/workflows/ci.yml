name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and test the libraries
        run: npm test

      - name: Type-check the app
        run: npm run check --workspace @dotworkout/pwa

      - name: Build the app
        run: npm run build --workspace @dotworkout/pwa
